<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 냉장고</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#eef6f8;color:#222}header{padding:16px;text-align:center;background:#7dd3fc;color:#033}h1{margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.fridge{width:260px;margin:20px auto;border:4px solid #999;border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.12)}.door{height:220px;border-bottom:2px solid #ddd;position:relative;cursor:pointer;transform-origin:left center;transition:.6s;background:linear-gradient(90deg,#fff,#e8f7ff)}.door.bottom{height:280px;border-bottom:none}.door.open{transform:perspective(800px) rotateY(-72deg)}.handle{position:absolute;right:16px;top:40%;width:8px;height:60px;background:#888;border-radius:8px}.inside{display:none;padding:10px;background:#f8fafc}.inside.show{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 14px rgba(0,0,0,.08)}input,select,button,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}button{background:#38bdf8;color:#fff;border:none;font-weight:700;cursor:pointer}.danger{background:#ef4444}.item{padding:10px;border-bottom:1px solid #eee}.small{font-size:12px;color:#666}.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:#dbeafe;margin-left:6px;font-size:12px}.comment{background:#f3f4f6;padding:8px;border-radius:10px;margin:6px 0}
</style>
</head>
<body>
<header><h1>🧊 우리집 냉장고</h1><div id='today'></div></header>
<div class='wrap'>
<div class='fridge'>
<div class='door top' onclick='toggleDoor("freezer")'><div class='handle'></div></div>
<div id='freezer' class='inside'></div>
<div class='door bottom' onclick='toggleDoor("fridge")'><div class='handle'></div></div>
<div id='fridge' class='inside'></div>
</div>
<div class='grid'>
<div class='card'>
<h3>식품 등록</h3>
<input id='name' placeholder='식품명'>
<select id='zone'><option value='냉장'>냉장</option><option value='냉동'>냉동</option></select>
<input id='buy' type='date'>
<input id='exp' type='date'>
<input id='qty' type='number' placeholder='수량'>
<input id='cal' type='number' placeholder='칼로리(kcal)'>
<textarea id='memo' placeholder='메모'></textarea>
<button onclick='addItem()'>추가</button>
</div>
<div class='card'>
<h3>알림</h3>
<div id='alerts'></div>
</div>
<div class='card'>
<h3>가족 메모</h3>
<input id='user' placeholder='이름'>
<input id='msg' placeholder='메시지'>
<button onclick='addComment()'>남기기</button>
<div id='comments'></div>
</div>
<div class='card'>
<h3>요리 추천</h3>
<div id='recipes'></div>
</div>
</div>
</div>
<script>
const KEY='fridge_items_v1', CKEY='fridge_comments_v1';
const $=id=>document.getElementById(id);
function load(k){return JSON.parse(localStorage.getItem(k)||'[]')} function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function toggleDoor(id){const door=id==='freezer'?document.querySelector('.top'):document.querySelector('.bottom');door.classList.toggle('open');$(id).classList.toggle('show');render();}
function addItem(){const items=load(KEY);items.push({name:$("name").value,zone:$("zone").value,buy:$("buy").value,exp:$("exp").value,qty:$("qty").value,cal:$("cal").value,memo:$("memo").value});save(KEY,items);document.querySelectorAll('input,textarea').forEach(e=>{if(e.type!=='date')e.value=''});render();}
function delItem(i){const items=load(KEY);items.splice(i,1);save(KEY,items);render();}
function daysLeft(exp){if(!exp)return 999;const d=Math.ceil((new Date(exp)-new Date())/86400000);return d;}
function render(){const items=load(KEY);$('freezer').innerHTML='<h4>❄ 냉동실</h4>'+items.map((x,i)=>x.zone==='냉동'?row(x,i):'').join('');$('fridge').innerHTML='<h4>🥬 냉장실</h4>'+items.map((x,i)=>x.zone==='냉장'?row(x,i):'').join('');$('alerts').innerHTML=items.map(x=>{const d=daysLeft(x.exp);if(d<0)return '⚠ '+x.name+' 유통기한 지남'; if(d<=3)return '⏰ '+x.name+' '+d+'일 남음'; return '';}).filter(Boolean).join('<br>')||'이상 없음'; const names=items.map(x=>x.name).join(', '); let rec=[]; if(names.includes('계란')) rec.push('계란말이'); if(names.includes('우유')) rec.push('크림파스타'); if(names.includes('햄')) rec.push('햄볶음밥'); if(names.includes('양파')) rec.push('양파수프'); $('recipes').innerHTML=rec.length?rec.join('<br>'):'재료를 추가하면 추천됩니다.'; renderComments();}
function row(x,i){return `<div class='item'><b>${x.name}</b><span class='badge'>${x.qty||0}개</span><div class='small'>구매:${x.buy||'-'} / 만료:${x.exp||'-'} / ${x.cal||0}kcal</div><div class='small'>${x.memo||''}</div><button class='danger' onclick='delItem(${i})'>삭제</button></div>`}
function addComment(){const c=load(CKEY);c.unshift({u:$("user").value||'가족',m:$("msg").value,t:new Date().toLocaleString()});save(CKEY,c);$('msg').value='';renderComments();}
function renderComments(){$('comments').innerHTML=load(CKEY).slice(0,8).map(x=>`<div class='comment'><b>${x.u}</b>: ${x.m}<div class='small'>${x.t}</div></div>`).join('')}
$('today').textContent=new Date().toLocaleDateString('ko-KR',{dateStyle:'full'});render();
</script>
</body>
</html>
