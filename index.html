<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다이어트 챌린지 프로 - v8.0 멤버 관리 추가</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #FF9A8B; --primary-light: #FFD1CA; --secondary: #6EDCD9; --bg: #FEF9F3; --text: #5D4037; --white: #ffffff; }
        body { font-family: 'Nanum Gothic', sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; margin: 0; letter-spacing: -0.5px; }
        .main-wrapper { max-width: 1200px; margin: 0 auto; }
        .global-dashboard { background: var(--white); border-radius: 30px; padding: 25px; margin-bottom: 30px; border: 3px solid var(--primary-light); box-shadow: 0 10px 30px rgba(255, 154, 139, 0.1); }
        .summary-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--bg); padding: 12px; border-radius: 20px; text-align: center; }
        .stat-card p { margin: 5px 0 0; font-size: 16px; font-weight: bold; color: var(--primary); }
        .card { background: var(--white); border-radius: 25px; padding: 22px; margin-bottom: 20px; border: 2px solid #f0f0f0; }
        h2 { margin: 0 0 15px 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: center; padding: 12px 10px; border-bottom: 1px solid #f9f9f9; }
        .progress-bar-bg { background: #eee; border-radius: 10px; height: 10px; width: 100%; margin-top: 5px; }
        .progress-bar-fill { background: var(--secondary); height: 100%; border-radius: 10px; }
        input, select { padding: 8px; border-radius: 10px; border: 2px solid #eee; outline: none; font-size: 13px; }
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 12px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; padding: 10px; }
        .btn-mint { background: var(--secondary); color: white; padding: 8px 15px; }
        .meal-row, .workout-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .chart-container-wide { position: relative; height: 350px; width: 100%; margin-top: 10px; }
        .fridge-item { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 12px; }
        .fridge-comment { background: #f9f9f9; padding: 8px; border-radius: 10px; margin-top: 5px; color: #666; font-style: italic; }
        .personal-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; }
        .member-add-box { background: #fff5f5; padding: 15px; border-radius: 20px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; border: 1px dashed var(--primary); }
        /* 추가된 스타일 */
        .history-list { max-height: 150px; overflow-y: auto; font-size: 12px; margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px dotted #eee; }
        .encouragement-box { background: linear-gradient(135deg, #fff0f0 0%, #fff9f3 100%); padding: 15px; border-radius: 20px; text-align: center; border: 1px solid var(--primary-light); }
        @media (max-width: 900px) { .personal-grid { grid-template-columns: 1fr; } .member-add-box { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="global-dashboard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="color:var(--primary); margin:0;">🏆 챌린지 통합 진행 현황</h2>
            <div class="member-add-box" style="margin-bottom:0; padding:10px;">
                <input type="text" id="newUserName" placeholder="새 멤버 이름" style="width:100px;">
                <input type="number" id="newUserWeight" placeholder="시작체중" style="width:80px;">
                <button class="btn-primary" onclick="addUser()" style="padding: 8px 15px;">멤버 추가</button>
            </div>
        </div>
        <div class="summary-stats">
            <div class="stat-card"><h4>참여 멤버</h4><p id="statCount">0명</p></div>
            <div class="stat-card"><h4>평균 진행률</h4><p id="statAvgProgress">0%</p></div>
            <div class="stat-card"><h4>팀 총 감량</h4><p id="statTotalLoss">0kg</p></div>
        </div>
        <table>
            <thead><tr><th>멤버</th><th>시작 체중</th><th>현재</th><th>목표</th><th>진행도</th><th>칭찬/응원</th></tr></thead>
            <tbody id="totalStatusList"></tbody>
        </table>
        <div class="chart-container-wide"><canvas id="adminChart"></canvas></div>
    </div>

    <div class="personal-area">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>👤 개인 목표 및 기록 관리</h2>
            <div style="display:flex; gap:10px; align-items:center;">
                <select id="userSelect" onchange="renderPersonalArea()" style="border: 2px solid var(--primary); font-weight:bold;"></select>
                <button onclick="deleteUser()" style="background:#ff4d4d; color:white; font-size:11px; padding:5px 10px;">삭제</button>
            </div>
        </div>
        <div class="personal-grid">
            <div class="card">
                <h2>🎯 다이어트 설정 및 체중</h2>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;">
                    <div style="display:flex; flex-direction:column;"><label style="font-size:11px; color:#999;">시작일</label><input type="date" id="startDate"></div>
                    <div style="display:flex; flex-direction:column;"><label style="font-size:11px; color:#999;">종료일</label><input type="date" id="endDate"></div>
                    <div style="display:flex; flex-direction:column;"><label style="font-size:11px; color:#999;">목표 체중</label><input type="number" id="targetWeight" step="0.1"></div>
                    <div style="display:flex; flex-direction:column; justify-content: flex-end;"><button class="btn-mint" onclick="updatePeriod()">설정 갱신</button></div>
                </div>
                <div style="background: #fffaf0; padding: 15px; border-radius: 20px; border: 1px solid var(--primary-light);">
                    <h3 style="margin: 0 0 10px 0; font-size: 14px; color: var(--primary);">📝 오늘 체중 입력</h3>
                    <div style="display: flex; gap: 8px;">
                        <input type="date" id="recordDate" style="flex: 1;"><input type="number" id="recordWeight" step="0.1" placeholder="kg" style="flex: 1;"><button class="btn-primary" onclick="saveWeight()">저장</button>
                    </div>
                    <div id="weightHistoryList" class="history-list"></div>
                </div>
                <div style="height:250px; margin-top:20px;"><canvas id="personalChart"></canvas></div>
                
                <div class="encouragement-box" style="margin-top:20px;">
                    <h3 style="margin:0 0 10px 0; font-size:14px; color:var(--primary);">✨ 오늘의 격려 한마디</h3>
                    <p id="motivationalMessage" style="font-size:13px; font-weight:bold; color:var(--text); margin-bottom:10px;">오늘도 충분히 잘하고 있어요!</p>
                    <div style="display:flex; gap:5px; justify-content:center;">
                        <button onclick="changeMessage()" style="font-size:11px; background:var(--primary-light); color:var(--text); padding:5px 10px;">새로운 응원</button>
                        <button onclick="selfCheck()" style="font-size:11px; background:var(--secondary); color:white; padding:5px 10px;">셀프 체크</button>
                    </div>
                </div>
            </div>
            <div>
                <div class="card">
                    <h2>🍱 오늘의 식단 (타인 평가 방식)</h2>
                    <div class="meal-input-group">
                        <div class="meal-row"><span style="width:40px; font-size:12px;">아침</span><input type="text" id="mealBreak" style="flex:1" placeholder="메뉴"><select id="badgeBreak"><option value="😇(갓생)">😇(갓생)</option><option value="✅(클린)">✅(클린)</option><option value="🤨(무난)">🤨(무난)</option><option value="🍕(치팅)">🍕(치팅)</option><option value="🚨(폭주)">🚨(폭주)</option></select></div>
                        <div class="meal-row"><span style="width:40px; font-size:12px;">점심</span><input type="text" id="mealLunch" style="flex:1" placeholder="메뉴"><select id="badgeLunch"><option value="😇(갓생)">😇(갓생)</option><option value="✅(클린)">✅(클린)</option><option value="🤨(무난)">🤨(무난)</option><option value="🍕(치팅)">🍕(치팅)</option><option value="🚨(폭주)">🚨(폭주)</option></select></div>
                        <div class="meal-row"><span style="width:40px; font-size:12px;">저녁</span><input type="text" id="mealDinner" style="flex:1" placeholder="메뉴"><select id="badgeDinner"><option value="😇(갓생)">😇(갓생)</option><option value="✅(클린)">✅(클린)</option><option value="🤨(무난)">🤨(무난)</option><option value="🍕(치팅)">🍕(치팅)</option><option value="🚨(폭주)">🚨(폭주)</option></select></div>
                    </div>
                    <button class="btn-primary" style="width:100%" onclick="saveDailyMeal()">기록 및 평가 저장</button>
                </div>
                <div class="card">
                    <h2>🏃 운동 상세 기록</h2>
                    <div style="margin-bottom:10px; display:flex; gap:5px;">
                         <input type="date" id="workoutDate" style="flex:1">
                    </div>
                    <div class="workout-row"><input type="text" id="workoutName" style="flex:1.5" placeholder="운동 명칭"><select id="workoutLevel"><option value="고">🔥고</option><option value="중">⚡중</option><option value="저">🌱저</option></select><button class="btn-mint" onclick="addWorkout()">기록</button></div>
                    <div id="workoutTodayList" style="font-size:12px; color:#888; margin-top:5px; max-height:100px; overflow-y:auto;"></div>
                </div>
                <div class="card">
                    <h2>🧊 냉장고 (구매일/추천)</h2>
                    <div style="display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px;">
                        <input type="text" id="foodName" placeholder="식재료"><div style="display:flex; gap:5px;"><input type="date" id="foodDate" style="flex:1"><button class="btn-mint" onclick="addFood()">등록</button></div>
                    </div>
                    <div id="fridgeList" style="max-height:150px; overflow-y:auto;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCuPp1KormGh0pk_TLkzWEGAsId5b85ySU",
        authDomain: "diet-f7eca.firebaseapp.com",
        databaseURL: "https://diet-f7eca-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "diet-f7eca",
        storageBucket: "diet-f7eca.firebasestorage.app",
        messagingSenderId: "170832747171",
        appId: "1:170832747171:web:048792cc1cbdae7452bd16",
        measurementId: "G-0M9QVX5LMM"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const todayStr = new Date().toISOString().split('T')[0];
    let appData = {}; 
    let personalChartObj = null, adminChartObj = null;

    // 격려 메시지 데이터
    const messages = [
        "오늘의 숫자가 당신의 가치를 결정하지 않아요!",
        "조금 늦어도 괜찮아요, 꾸준함이 승리합니다!",
        "물 한 잔 마셨나요? 지금이 가장 예쁠 때입니다!",
        "어제의 나보다 조금 더 움직인 자신을 칭찬해주세요!",
        "당신이 포기하지 않는 한, 변화는 이미 시작되었습니다!"
    ];

    db.ref('diet_challenge_v8').on('value', (snapshot) => {
        appData = snapshot.val() || {};
        updateUserDropdown();
        renderTopDashboard();
        renderPersonalArea();
    });

    function addUser() {
        const name = document.getElementById('newUserName').value;
        const weight = parseFloat(document.getElementById('newUserWeight').value);
        if(!name || isNaN(weight)) { alert("이름과 시작 체중을 입력해주세요."); return; }
        const newId = "u" + Date.now();
        db.ref('diet_challenge_v8/' + newId).set({
            name: name,
            period: { start: todayStr, end: todayStr },
            weight: { target: weight, history: [{date: todayStr, w: weight}] },
            fridge: [], badges: {up: 0}, meals: {}, workouts: {}
        });
        document.getElementById('newUserName').value = '';
        document.getElementById('newUserWeight').value = '';
    }

    function deleteUser() {
        const id = document.getElementById('userSelect').value;
        if(Object.keys(appData).length <= 1) { alert("최소 한 명의 멤버는 있어야 합니다."); return; }
        if(confirm(`${appData[id].name} 멤버를 삭제하시겠습니까?`)) {
            db.ref('diet_challenge_v8/' + id).remove();
        }
    }

    function updateUserDropdown() {
        const select = document.getElementById('userSelect'); const prev = select.value; select.innerHTML = '';
        Object.keys(appData).forEach(id => { const opt = document.createElement('option'); opt.value = id; opt.textContent = appData[id].name; select.appendChild(opt); });
        if (appData[prev]) select.value = prev; else select.selectedIndex = 0;
    }

    function renderTopDashboard() {
        const list = document.getElementById('totalStatusList'); list.innerHTML = '';
        let totalLoss = 0, progressSum = 0; const ids = Object.keys(appData);
        ids.forEach(id => {
            const d = appData[id], hist = d.weight?.history || [];
            if(hist.length === 0) return;
            const startW = hist[0].w, curW = hist[hist.length-1].w, targetW = d.weight.target;
            const loss = (startW - curW); const progress = Math.max(0, Math.min(100, (loss / (startW - targetW || 1) * 100)));
            totalLoss += loss; progressSum += progress;
            list.innerHTML += `<tr><td><b>${d.name}</b></td><td>${startW}kg</td><td style="color:var(--primary); font-weight:bold;">${curW}kg</td><td>${targetW}kg</td><td><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${progress}%"></div></div></td><td><button onclick="giveBadge('${id}')">🔥 ${d.badges?.up || 0}</button></td></tr>`;
        });
        document.getElementById('statCount').innerText = ids.length + '명';
        document.getElementById('statAvgProgress').innerText = (progressSum / (ids.length || 1)).toFixed(1) + '%';
        document.getElementById('statTotalLoss').innerText = totalLoss.toFixed(1) + 'kg';
        updateAdminChart(ids);
    }

    function updateAdminChart(ids) {
        const ctx = document.getElementById('adminChart').getContext('2d');
        if (adminChartObj) adminChartObj.destroy();
        let allDates = [...new Set(Object.values(appData).flatMap(u => (u.weight?.history || []).map(h => h.date)))];
        Object.values(appData).forEach(u => { if(u.period?.end && !allDates.includes(u.period.end)) allDates.push(u.period.end); });
        allDates.sort((a,b) => new Date(a) - new Date(b));
        const datasets = ids.map((id, i) => {
            const hist = appData[id].weight?.history || []; if(hist.length === 0) return [];
            const curW = hist[hist.length-1].w, curD = hist[hist.length-1].date;
            const color = `hsl(${(i * 360) / ids.length}, 70%, 60%)`;
            return [
                { label: appData[id].name, data: allDates.map(d => hist.find(h => h.date === d)?.w || null), borderColor: color, borderWidth: 3, tension: 0.3, spanGaps: true },
                { label: '목표경로', data: allDates.map(d => (d === curD ? curW : (d === appData[id].period?.end ? appData[id].weight?.target : null))), borderColor: color, borderDash: [5, 5], spanGaps: true, pointRadius: 0 }
            ];
        }).flat().filter(d => d);
        adminChartObj = new Chart(ctx, { type: 'line', data: { labels: allDates.map(d => d.split('-').slice(1).join('/')), datasets }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });
    }

    function renderPersonalArea() {
        const id = document.getElementById('userSelect').value; if(!appData[id]) return; const d = appData[id];
        document.getElementById('startDate').value = d.period?.start || ""; document.getElementById('endDate').value = d.period?.end || "";
        document.getElementById('targetWeight').value = d.weight?.target || 0; document.getElementById('recordDate').value = todayStr;
        document.getElementById('workoutDate').value = todayStr; // [2번] 기본 운동날짜 설정
        
        const m = d.meals?.[todayStr] || { brk: ["","😇(갓생)"], lun: ["","✅(클린)"], din: ["","🤨(무난)"] };
        document.getElementById('mealBreak').value = m.brk[0]; document.getElementById('badgeBreak').value = m.brk[1];
        document.getElementById('mealLunch').value = m.lun[0]; document.getElementById('badgeLunch').value = m.lun[1];
        document.getElementById('mealDinner').value = m.din[0]; document.getElementById('badgeDinner').value = m.din[1];
        
        // [2번] 모든 운동 기록 렌더링 (최신순)
        const wksMap = d.workouts || {};
        let allWks = [];
        Object.keys(wksMap).forEach(date => {
            wksMap[date].forEach((w, i) => allWks.push({ ...w, date, idx: i }));
        });
        allWks.sort((a,b) => new Date(b.date) - new Date(a.date));
        document.getElementById('workoutTodayList').innerHTML = allWks.map(w => `<div class="history-item"><span>[${w.date}] ${w.name} (${w.level})</span> <span onclick="delWorkout('${w.date}', ${w.idx})" style="color:red;cursor:pointer;">×</span></div>`).join('');
        
        document.getElementById('fridgeList').innerHTML = (d.fridge || []).map((f, i) => `<div class="fridge-item"><div style="display:flex; justify-content:space-between;"><span>${f.name} (${f.date})</span><span onclick="delFood(${i})" style="color:red;cursor:pointer;">×</span></div><div class="fridge-comment">💬: ${f.comment || '추천 대기중'} <button onclick="addComment(${i})" style="font-size:10px;">코멘트</button></div></div>`).join('');
        
        // [3번] 체중 기록 리스트 렌더링
        const hist = d.weight?.history || [];
        document.getElementById('weightHistoryList').innerHTML = [...hist].reverse().map((h, i) => `<div class="history-item"><span>${h.date}: ${h.w}kg</span> <span onclick="delWeight(${hist.length - 1 - i})" style="color:red;cursor:pointer;">삭제</span></div>`).join('');
        
        updatePersonalChart(d);
    }

    function updatePersonalChart(userData) {
        const ctx = document.getElementById('personalChart').getContext('2d');
        if (personalChartObj) personalChartObj.destroy();
        const hist = userData.weight?.history || [];
        personalChartObj = new Chart(ctx, { type: 'line', data: { labels: hist.map(h => h.date.split('-').slice(1).join('/')), datasets: [{ label: '체중', data: hist.map(h => h.w), borderColor: '#FF9A8B', fill: true, backgroundColor: 'rgba(255,154,139,0.1)' }] }, options: { responsive: true, maintainAspectRatio: false } });
    }

    function saveWeight() {
        const id = document.getElementById('userSelect').value; const d = document.getElementById('recordDate').value, w = parseFloat(document.getElementById('recordWeight').value);
        if(!id || !d || isNaN(w)) return;
        let hist = appData[id].weight?.history || [];
        let entry = hist.find(e => e.date === d); if(entry) entry.w = w; else hist.push({date: d, w: w});
        hist.sort((a,b) => new Date(a.date) - new Date(b.date));
        db.ref(`diet_challenge_v8/${id}/weight/history`).set(hist);
    }

    // [3번] 체중 기록 삭제 기능
    function delWeight(idx) {
        const id = document.getElementById('userSelect').value;
        let hist = appData[id].weight.history;
        if(hist.length <= 1) { alert("최소 1개의 기록은 있어야 합니다."); return; }
        if(confirm("이 체중 기록을 삭제할까요?")) {
            hist.splice(idx, 1);
            db.ref(`diet_challenge_v8/${id}/weight/history`).set(hist);
        }
    }
    
    function updatePeriod() {
        const id = document.getElementById('userSelect').value;
        db.ref(`diet_challenge_v8/${id}/period`).set({ start: document.getElementById('startDate').value, end: document.getElementById('endDate').value });
        db.ref(`diet_challenge_v8/${id}/weight/target`).set(parseFloat(document.getElementById('targetWeight').value) || 0);
    }

    function saveDailyMeal() {
        const id = document.getElementById('userSelect').value;
        const mealData = {
            brk: [document.getElementById('mealBreak').value, document.getElementById('badgeBreak').value],
            lun: [document.getElementById('mealLunch').value, document.getElementById('badgeLunch').value],
            din: [document.getElementById('mealDinner').value, document.getElementById('badgeDinner').value]
        };
        db.ref(`diet_challenge_v8/${id}/meals/${todayStr}`).set(mealData).then(() => alert("저장 완료"));
    }

    function addWorkout() {
        const id = document.getElementById('userSelect').value;
        const name = document.getElementById('workoutName').value, level = document.getElementById('workoutLevel').value, date = document.getElementById('workoutDate').value;
        if(!name || !date) return;
        let wks = appData[id].workouts?.[date] || []; wks.push({ name, level });
        db.ref(`diet_challenge_v8/${id}/workouts/${date}`).set(wks);
        document.getElementById('workoutName').value = '';
    }

    // [2번/3번] 운동 기록 삭제
    function delWorkout(date, idx) {
        const id = document.getElementById('userSelect').value;
        let wks = appData[id].workouts[date];
        wks.splice(idx, 1);
        if(wks.length === 0) db.ref(`diet_challenge_v8/${id}/workouts/${date}`).remove();
        else db.ref(`diet_challenge_v8/${id}/workouts/${date}`).set(wks);
    }

    function addFood() {
        const id = document.getElementById('userSelect').value, name = document.getElementById('foodName').value, date = document.getElementById('foodDate').value;
        if(!name || !date) return;
        let fridge = appData[id].fridge || []; fridge.push({ name, date, comment: "" });
        db.ref(`diet_challenge_v8/${id}/fridge`).set(fridge);
        document.getElementById('foodName').value='';
    }

    function addComment(idx) {
        const id = document.getElementById('userSelect').value, comm = prompt("추천 요리:");
        if(comm) db.ref(`diet_challenge_v8/${id}/fridge/${idx}/comment`).set(comm);
    }

    function delFood(i) {
        const id=document.getElementById('userSelect').value;
        let fridge = appData[id].fridge; fridge.splice(i,1);
        db.ref(`diet_challenge_v8/${id}/fridge`).set(fridge);
    }

    function giveBadge(id) {
        db.ref(`diet_challenge_v8/${id}/badges/up`).transaction(c => (c || 0) + 1);
    }

    // [1번] 추가 기능 함수
    function changeMessage() {
        const randomMsg = messages[Math.floor(Math.random() * messages.length)];
        document.getElementById('motivationalMessage').innerText = randomMsg;
    }

    function selfCheck() {
        const checks = ["오늘 물 2L 마셨나요?", "단백질을 챙겨 먹었나요?", "충분한 수면을 취했나요?", "7000보 이상 걸었나요?"];
        alert("✔️ 셀프 체크리스트:\n\n" + checks.join("\n"));
    }
</script>
</body>
</html>
